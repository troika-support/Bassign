name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux runners have Docker, so the integration tests get a real SQL Server via Testcontainers.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The MAUI app (Bassign.Mobile) needs workloads the runner doesn't have; build and test the
      # test projects, which pull in everything else (Domain, Application, Infrastructure, Api, Field.Core).
      - name: Unit tests
        run: dotnet test tests/Bassign.UnitTests -c Release --logger "trx;LogFileName=unit.trx"

      - name: Integration tests (SQL Server in Docker)
        run: dotnet test tests/Bassign.IntegrationTests -c Release --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
